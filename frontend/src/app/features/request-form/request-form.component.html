<div class="overlay" (click)="cancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <header class="modal__header">
      <h2>Nova Solicitação</h2>
      <button type="button" class="icon-btn" aria-label="Fechar" (click)="cancel()">&times;</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="title">Título</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Ex.: Acesso ao GitHub Enterprise"
          autocomplete="off"
        />
        @if (isInvalid('title')) {
          <small class="field__error">O título é obrigatório.</small>
        }
      </div>

      <div class="field">
        <label for="requesterId">Solicitante</label>
        <input
          id="requesterId"
          type="text"
          formControlName="requesterId"
          placeholder="Ex.: user-123"
          autocomplete="off"
        />
        @if (isInvalid('requesterId')) {
          <small class="field__error">O solicitante é obrigatório.</small>
        }
      </div>

      <div class="field-row">
        <div class="field">
          <label for="category">Categoria</label>
          <select id="category" formControlName="category">
            @for (category of categories; track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
        </div>

        <div class="field">
          <label for="priority">Prioridade</label>
          <select id="priority" formControlName="priority">
            @for (priority of priorities; track priority) {
              <option [value]="priority">{{ priority }}</option>
            }
          </select>
        </div>
      </div>

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }

      <footer class="modal__footer">
        <button type="button" class="btn btn--ghost" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="submitting">
          {{ submitting ? 'Criando…' : 'Criar solicitação' }}
        </button>
      </footer>
    </form>
  </div>
</div>
